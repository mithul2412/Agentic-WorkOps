selector:
  enabled_live: true
  category_key: team_profile|ticket_type|risk_tier
  default_policy_id: manager_ollama_qwen25_sft_v1
  candidate_policy_ids:
    - manager_ollama_qwen25_sft_v1
    - manager_ollama_gemma2_local_v1
  epsilon: 0.15
  min_samples: 6

policies:
  - id: manager_ollama_qwen25_sft_v1
    type: llm_api
    provider: ollama
    base_url_env: OLLAMA_BASE_URL
    model_env: MANAGER_OLLAMA_MODEL
    model_default: qwen25-triage
    max_new_tokens: 320
    temperature: 0.0
    max_attempts: 2
    input_cost_coef: 0.0
    output_cost_coef: 0.0

  - id: manager_ollama_gemma2_local_v1
    type: llm_api
    provider: ollama
    base_url_env: OLLAMA_BASE_URL
    model_default: gemma2-triage
    max_new_tokens: 320
    temperature: 0.0
    max_attempts: 2
    input_cost_coef: 0.0
    output_cost_coef: 0.0

  - id: judge_gemini_v1
    type: llm_api
    provider: gemini
    api_key_env: GEMINI_API_KEY
    base_url_env: GEMINI_API_BASE
    model_env: JUDGE_GEMINI_MODEL
    model_default: gemini-1.5-pro
    max_new_tokens: 320
    temperature: 0.0
    max_attempts: 1
    input_cost_coef: 0.0040
    output_cost_coef: 0.0080

  - id: judge_or_v1
    type: llm_api
    provider: openrouter
    api_key_env: OPENROUTER_API_KEY
    base_url_env: OPENROUTER_BASE_URL
    model_env: JUDGE_OPENROUTER_MODEL
    model_default: arcee-ai/trinity-large-preview:free
    max_new_tokens: 320
    temperature: 0.0
    max_attempts: 1
    input_cost_coef: 0.0040
    output_cost_coef: 0.0080

  - id: judge_groq_v1
    type: llm_api
    provider: groq
    api_key_env: GROQ_API_KEY
    base_url_env: GROQ_BASE_URL
    model_env: JUDGE_GROQ_MODEL
    model_default: llama-3.3-70b-versatile
    max_new_tokens: 320
    temperature: 0.0
    max_attempts: 1
    input_cost_coef: 0.0040
    output_cost_coef: 0.0085

judge:
  policy_id: judge_groq_v1
  max_tokens: 300
  temperature: 0.0
